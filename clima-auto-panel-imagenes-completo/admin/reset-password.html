<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Restablecer contraseña | SIS Auto</title>

  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="pagina-login">

  <main class="login-contenedor">

    <section class="login-tarjeta">

      <h1>Restablecer contraseña</h1>

      <p class="login-descripcion">
        Ingresá y confirmá tu nueva contraseña.
      </p>

      <form id="form-reset-password">

        <div class="campo-formulario">
          <label for="nueva-contrasena">
            Nueva contraseña
          </label>

          <input
            type="password"
            id="nueva-contrasena"
            name="nueva-contrasena"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="campo-formulario">
          <label for="confirmar-contrasena">
            Confirmar contraseña
          </label>

          <input
            type="password"
            id="confirmar-contrasena"
            name="confirmar-contrasena"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button
          type="submit"
          id="boton-reset-password"
        >
          Actualizar contraseña
        </button>

        <p
          id="mensaje-reset-password"
          class="mensaje-login"
          hidden
        ></p>

      </form>

      <a href="login.html" class="volver-login">
        Volver al inicio de sesión
      </a>

    </section>

  </main>

  <!-- Debe cargar primero la librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Aquí debe ir el archivo que crea window.supabaseClient -->
  <script src="../js/supabase.js"></script>

  <!-- Lógica de cambio de contraseña -->
  <script src="js/reset-password.js"></script>

</body>
</html>
